<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SortMyPlate | Airy Biomarker Nutrition</title>
    <meta name="theme-color" content="#13251B">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        window.smpStartGoogleSignIn = function(clientId, callback) {
            if (!clientId || !window.google || !window.google.accounts) {
                return false;
            }
            try {
                if (window.google.accounts.oauth2 && window.google.accounts.oauth2.initTokenClient) {
                    var client = window.google.accounts.oauth2.initTokenClient({
                        client_id: clientId,
                        scope: "openid email profile",
                        callback: function(resp) {
                            if (resp && resp.access_token) {
                                callback("access_token", resp.access_token);
                            } else {
                                callback("error", (resp && resp.error) || "Google sign-in did not return an access token");
                            }
                        },
                        error_callback: function(err) {
                            if (err && err.type === "popup_closed") {
                                callback("cancelled", "");
                            } else {
                                callback("error", (err && (err.message || err.type)) || "Google sign-in was cancelled");
                            }
                        }
                    });
                    client.requestAccessToken({ prompt: "select_account" });
                    return true;
                }
                if (window.google.accounts.id) {
                    window.google.accounts.id.initialize({
                        client_id: clientId,
                        ux_mode: "popup",
                        use_fedcm_for_prompt: true,
                        callback: function(resp) {
                            if (resp && resp.credential) {
                                callback("id_token", resp.credential);
                            } else {
                                callback("error", "No Google ID token returned");
                            }
                        }
                    });
                    window.google.accounts.id.prompt(function(notification) {
                        if (notification && (notification.isNotDisplayed() || notification.isSkippedMoment())) {
                            callback("cancelled", "");
                        }
                    });
                    return true;
                }
            } catch (e) {
                return false;
            }
            return false;
        };
    </script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: linear-gradient(170deg, #F3F7F2 0%, #E6EFE4 100%);
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #loading {
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #13251B;
            font-size: 17px;
            font-weight: 700;
        }
        #loading span {
            font-size: 13px;
            color: #4C5D54;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div>🌿 Loading SortMyPlate</div>
        <span>Preparing your encrypted wellness studio...</span>
    </div>
    <script type="application/javascript" src="composeApp.js"></script>
</body>
</html>
